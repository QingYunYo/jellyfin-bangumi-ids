[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-bangumi-ids"
version = "1.2.0"
description = "修好 Jellyfin 里 Bangumi 插件的集 ID：批量扫描、按季映射、全库校验，只依赖标准库。"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["jellyfin", "bangumi", "anime", "scrobble", "metadata"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
jbmid = "jellyfin_bangumi_ids.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
